name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: traureise
          POSTGRES_PASSWORD: traureise
          POSTGRES_DB: traureise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traureise" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      POSTGRES_USER: traureise
      POSTGRES_PASSWORD: traureise
      POSTGRES_PORT: "5432"
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_UI_PORT: "8025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E tests (Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the stack exactly as self-hosters do
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: App logs
        if: failure()
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
