name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  build-2gb:
    name: Build in 2 GB of RAM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image must build on a small VPS: the same `next build` as the Dockerfile (same heap limit), in a
      # container that gets 2 GB of memory and no swap. Killed for lack of memory means the job fails.
      - name: next build with 2 GB
        run: |
          docker run --rm --memory=2g --memory-swap=2g \
            -e NEXT_TELEMETRY_DISABLED=1 -e NODE_OPTIONS=--max-old-space-size=1536 \
            -v "$PWD":/app -w /app node:24-bookworm-slim \
            sh -c "npm ci --no-audit --no-fund && npm run build && test -f .next/BUILD_ID"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: traureise
          POSTGRES_PASSWORD: traureise
          POSTGRES_DB: traureise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traureise" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      POSTGRES_USER: traureise
      POSTGRES_PASSWORD: traureise
      POSTGRES_PORT: "5432"
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_UI_PORT: "8025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E tests (Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the stack as self-hosters do, plus a billing instance and the Creem stub
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: App logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs app app-billing creem-stub
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
